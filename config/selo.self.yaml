forge:
  poll_interval_sec: 5
  default_max_minutes: 8
  default_max_rounds: 1
  default_max_files: 10
  default_max_patch_lines: 200
  stop_file: ".selo-stop"
  lock_file: ".selo.lock"
  notify: "stdout"
  ntfy_topic: ""
  # Empty for self-hosting: Selo's own source/tests/docs contain the demo
  # claim terms (PROFITABLE/LIVE_READY/MONEY_ENGINE), so a full-worktree scan
  # would always trip. Use this config when running Selo against the Selo repo.
  forbidden_claims: []
  runner:
    mode: "real"
    command: "/Users/desmondkam/selo/scripts/opencode-adapter.sh"
    args:
      - "--task-file"
      - "{{task_file}}"
      - "--workdir"
      - "{{worktree}}"
      - "--max-rounds"
      - "1"
      - "--max-minutes"
      - "{{max_minutes}}"
  containment:
    strategy: worktree
    image: alpine:latest

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege by default; each job grants only what it needs.
permissions:
  contents: read

env:
  # Cross-compiled targets. Keep in sync with install.sh's OS/ARCH mapping.
  TARGETS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64

jobs:
  # Build every binary in one job so that all subjects exist together. This is
  # what lets a single checksums.txt serve both purposes at once: it is the blob
  # cosign signs (ADR-002) and, base64-encoded, the base64-subjects input the
  # SLSA provenance generator consumes (ADR-003).
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.checksums.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # >= 1.24 is a hard requirement: Go < 1.24 omits the LC_UUID load
          # command from darwin binaries and newer macOS dyld aborts on load.
          # Building with the Go 1.21 that `go-version-file: go.mod` resolved is
          # what shipped unrunnable darwin binaries in v0.4.1, v0.5.0, v0.5.1.
          go-version: '1.24.x'

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for target in $TARGETS; do
            os="${target%%/*}"
            arch="${target##*/}"
            echo "building selo-$os-$arch ($VERSION)"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.Version=$VERSION" \
              -o "selo-$os-$arch" ./cmd/selo/
          done

      # Fail closed before anything is signed or published. install.sh verifies
      # that the bytes match checksums.txt; it cannot know whether the binary
      # loads. A darwin binary with no LC_UUID is rejected by newer macOS dyld,
      # so it must never reach the release.
      #
      # Built and run rather than `go run`: go run collapses every non-zero exit
      # to 1, and exit 2 is what tells us a glob matched nothing at all.
      - name: Verify darwin binaries are loadable
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/check-macho-uuid" ./scripts/check-macho-uuid
          "$RUNNER_TEMP/check-macho-uuid" selo-darwin-*

      - name: Generate checksums
        id: checksums
        run: |
          set -euo pipefail
          # Sorted for determinism: the same inputs must always produce a
          # byte-identical checksums.txt, or the signature is not reproducible.
          sha256sum selo-* | LC_ALL=C sort -k2 > checksums.txt
          cat checksums.txt
          echo "hashes=$(base64 -w0 < checksums.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: selo-dist
          path: |
            selo-*
            checksums.txt
          if-no-files-found: error

  # Sign checksums.txt with cosign keyless (ADR-002) and publish the release.
  # Keyless means no long-lived signing key: the signature's Fulcio certificate
  # binds to this workflow's OIDC identity, which install.sh pins.
  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # OIDC token for Fulcio keyless signing.
    steps:
      # The release body is docs/releases/<tag>.md, so this job needs the
      # repository tree. actions/download-artifact only brings the built
      # binaries; without a checkout the notes file is absent and the
      # "Check release notes exist" step fails closed.
      - uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: selo-dist

      - name: Verify checksums
        run: sha256sum -c checksums.txt

      # cosign is downloaded and verified against a SHA-256 pinned here, in our
      # own reviewed tree, rather than via sigstore/cosign-installer.
      #
      # That action cannot install any cosign v3.x. After fetching the binary it
      # fetches the legacy detached signature (cosign-linux-amd64.sig) and
      # verifies it against release-cosign.pub; cosign v3.x no longer publishes
      # those assets, having replaced them with .sigstore.json bundles. The fetch
      # 404s, `curl -f` exits 22, and the whole release job dies before anything
      # is signed or uploaded. It has been broken since this workflow was
      # written -- v0.6.0 was simply the first tag to run it.
      #
      # The digest below is the one published in cosign's own
      # cosign_checksums.txt for this release, and was confirmed by downloading
      # the artifact and hashing it.
      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/')
        env:
          COSIGN_VERSION: v3.1.2
          COSIGN_SHA256: f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 -o cosign \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum -c -
          chmod +x cosign
          sudo mv cosign /usr/local/bin/cosign
          cosign version

      - name: Sign checksums
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle checksums.txt.sigstore.json \
            checksums.txt

      # Every tag must ship hand-written release notes. Auto-generated notes list
      # commits; they cannot tell a user that the previous release was broken,
      # which is the part someone upgrading actually needs to read.
      - name: Check release notes exist
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "::error title=missing release notes::$notes does not exist; every tag must ship hand-written notes under docs/releases/"
            exit 1
          fi
          echo "release notes: $notes"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            selo-*
            checksums.txt
            checksums.txt.sigstore.json
          # A supplied body is pre-pended to the auto-generated commit list, so
          # the post-mortem leads and the commit log still follows.
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true

  # Unforgeable build provenance (ADR-003). The reusable workflow runs the
  # signing in an isolated job, which is what makes this Build Level 3 rather
  # than L2. Pinned to a full version tag, not a floating major.
  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write # Keyless signing of the provenance.
      contents: write # Attach the provenance to the release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true

name: ci

on:
  push:
    branches: [main, public-v01]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          out=$($(go env GOROOT)/bin/gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi

      - name: Build
        run: go build ./...

      - name: Internal package tests
        run: |
          set +e
          go test ./internal/... -count=1 > /tmp/internal.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -aE '^(--- FAIL|FAIL|    [A-Za-z0-9_]+\.go:)' /tmp/internal.log | head -40 > /tmp/fails.txt
            while IFS= read -r line; do
              echo "::error title=TEST::$line"
            done < /tmp/fails.txt
          fi
          exit $status

      - name: Daemon tests
        env:
          SELO_HOME: ${{ github.workspace }}
        run: |
          set +e
          go test ./cmd/selo/ -count=1 > /tmp/daemon.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -aE '^(--- FAIL|FAIL|    [A-Za-z0-9_]+\.go:)' /tmp/daemon.log | head -40 > /tmp/dfails.txt
            while IFS= read -r line; do
              echo "::error title=TEST::$line"
            done < /tmp/dfails.txt
          fi
          exit $status

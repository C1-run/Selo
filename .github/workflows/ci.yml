name: ci

on:
  push:
    branches: [main, public-v01]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          out=$($(go env GOROOT)/bin/gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi

      - name: Build
        run: go build ./...

      - name: Internal package tests
        run: go test ./internal/... -count=1

      - name: Daemon tests
        env:
          SELO_HOME: ${{ github.workspace }}
        run: go test ./cmd/selo/ -count=1

      - name: Safety-control selftest
        run: go run ./cmd/selo/ selftest

      - name: Installer verification tests
        run: bash scripts/test-install.sh

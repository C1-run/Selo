name: ci

on:
  push:
    branches: [main, public-v01]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # >= 1.24 is a hard requirement, not a preference: Go < 1.24 omits the
          # LC_UUID load command from darwin binaries, and newer macOS dyld
          # aborts on load ("missing LC_UUID load command" -> abort trap). The
          # Go 1.21 that `go-version-file: go.mod` resolved is why the macOS leg
          # failed from 79b2fb9 onward. Verified: 1.21/1.22/1.23 omit LC_UUID,
          # 1.24+ emits it.
          go-version: '1.24.x'

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          out=$($(go env GOROOT)/bin/gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi

      - name: Build
        run: go build ./...

      - name: Verify the darwin binary is loadable
        if: runner.os == 'macOS'
        run: |
          # The toolchain, not the tests, decides whether a darwin binary can
          # start. Build one and check it here so a regression in the Go version
          # fails on the same commit that introduces it.
          go build -o "$RUNNER_TEMP/selo-darwin-check" ./cmd/selo/
          go build -o "$RUNNER_TEMP/check-macho-uuid" ./scripts/check-macho-uuid
          "$RUNNER_TEMP/check-macho-uuid" "$RUNNER_TEMP/selo-darwin-check"

      - name: Internal package tests
        run: |
          log="${RUNNER_TEMP:-/tmp}/internal-tests.log"
          if go test ./internal/... -count=1 >"$log" 2>&1; then
            cat "$log"
            exit 0
          fi
          cat "$log"
          # Job logs need repo admin to download; check-run annotations do not.
          # Re-surface the tail of the failure as an annotation so a platform-only
          # failure (e.g. macOS arm64) is diagnosable from outside the repo.
          # Sanitised: newlines -> '|', '::' -> ':' so test output cannot inject
          # workflow commands.
          detail=$(tail -c 3000 "$log" | tr '\n' '|' | sed 's/::/:/g')
          echo "::error title=internal package tests failed::${detail}"
          exit 1

      - name: Daemon tests
        env:
          SELO_HOME: ${{ github.workspace }}
        run: |
          log="${RUNNER_TEMP:-/tmp}/daemon-tests.log"
          if go test ./cmd/selo/ -count=1 >"$log" 2>&1; then
            cat "$log"
            exit 0
          fi
          cat "$log"
          detail=$(tail -c 3000 "$log" | tr '\n' '|' | sed 's/::/:/g')
          echo "::error title=daemon tests failed::${detail}"
          exit 1

      - name: Safety-control selftest
        run: go run ./cmd/selo/ selftest

      - name: Installer verification tests
        run: bash scripts/test-install.sh
